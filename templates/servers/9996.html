<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCUM 服务器监控</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script defer src="https://va.vercel.app/v1/speed-insights/script.js"></script>
    <style>
        :root {
            --primary: #00ff9d;
            --primary-dark: #00cc7d;
            --bg: #121212;
            --card-bg: #1e1e1e;
            --card-border: #2a2a2a;
            --text: #e0e0e0;
            --text-secondary: #888;
            --success: #00c853;
            --danger: #ff1744;
            --highlight: #00ff9d;
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            min-height: 100vh;
            padding: 20px;
            background-image: radial-gradient(circle at 50% 50%, rgba(39, 39, 39, 0.1) 0%, rgba(12, 12, 12, 0.8) 100%), 
                linear-gradient(to bottom right, #1a1a1a, #0a0a0a);
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            padding: 10px 0;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 5px;
            color: var(--highlight);
            text-shadow: 0 0 15px rgba(0, 255, 157, 0.4);
            letter-spacing: 1px;
        }

        .header p {
            color: var(--text-secondary);
            font-size: 1.1rem;
        }

        .server-info, .control-panel {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            border: 1px solid var(--card-border);
            transition: var(--transition);
        }

        .server-info:hover, .control-panel:hover {
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.45);
            transform: translateY(-3px);
        }

        .server-header {
            display: flex;
            align-items: center;
            margin-bottom: 25px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 15px;
            flex-wrap: wrap;
        }

        .server-header h2 {
            font-size: 1.8rem;
            color: var(--primary);
            flex-grow: 1;
            margin-right: 20px;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 15px;
            border-radius: 50px;
            font-weight: bold;
            font-size: 0.95rem;
        }

        .status-active {
            background: rgba(0, 200, 83, 0.15);
            color: var(--success);
        }

        .status-inactive {
            background: rgba(255, 23, 68, 0.15);
            color: var(--danger);
        }

        .indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 8px;
        }

        .indicator.active {
            background-color: var(--success);
            box-shadow: 0 0 10px var(--success);
        }

        .indicator.inactive {
            background-color: var(--danger);
            box-shadow: 0 0 10px var(--danger);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .stat-box {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }

        .stat-box.highlighted {
            background: linear-gradient(145deg, rgba(0, 40, 30, 0.5), rgba(0, 20, 15, 0.7));
            border: 1px solid rgba(0, 255, 157, 0.3);
            box-shadow: 0 0 20px rgba(0, 255, 157, 0.15);
        }

        .stat-box:hover {
            transform: translateY(-5px);
            border-color: rgba(255, 255, 255, 0.1);
        }

        .stat-label {
            font-size: 0.95rem;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 2.2rem;
            font-weight: bold;
            color: var(--highlight);
        }

        .stats-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .detail-box {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .detail-label {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .detail-label i {
            width: 20px;
            text-align: center;
        }

        .detail-value {
            font-size: 1.1rem;
            color: var(--text);
            font-weight: 500;
            word-break: break-all;
        }

        .server-rank {
            display: inline-block;
            background: linear-gradient(45deg, #ffb300, #ff6d00);
            color: #fff;
            padding: 3px 10px;
            border-radius: 4px;
            font-size: 0.9rem;
            margin-left: 5px;
        }

        .control-panel {
            padding: 20px;
        }

        .refresh-controls {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .refresh-btn {
            background: linear-gradient(to right, var(--primary), var(--primary-dark));
            color: #000;
            border: none;
            padding: 12px 25px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: var(--transition);
            box-shadow: 0 5px 15px rgba(0, 255, 157, 0.3);
        }

        .refresh-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 255, 157, 0.5);
        }

        .refresh-btn:active {
            transform: translateY(0);
            box-shadow: 0 3px 10px rgba(0, 255, 157, 0.3);
        }

        select {
            padding: 11px 15px;
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background-color: rgba(0, 0, 0, 0.3);
            color: var(--text);
            cursor: pointer;
            font-size: 0.95rem;
            transition: var(--transition);
        }

        select:hover {
            border-color: var(--primary);
        }

        select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(0, 255, 157, 0.3);
        }

        .next-refresh {
            color: var(--text-secondary);
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .time-highlight {
            color: var(--highlight);
            font-weight: bold;
            font-size: 1.1rem;
            background: rgba(0, 255, 157, 0.1);
            padding: 2px 8px;
            border-radius: 4px;
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }
            
            .server-header {
                flex-direction: column;
                align-items: flex-start;
            }
            
            .status-indicator {
                margin-top: 10px;
                align-self: flex-start;
            }
            
            .stats-grid {
                grid-template-columns: 1fr;
            }
            
            .refresh-controls {
                flex-direction: column;
                align-items: stretch;
            }
            
            .refresh-btn, select {
                width: 100%;
                justify-content: center;
            }
        }

        @media (max-width: 480px) {
            .header h1 {
                font-size: 2rem;
            }
            
            .stat-value {
                font-size: 1.8rem;
            }
            
            .server-info, .control-panel {
                padding: 20px 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>SCUM 服务器监控</h1>
            <p>实时监控服务</p>
        </div>
        
        <div class="server-info">
            <div class="server-header">
                <h2 id="serverName">正在加载服务器数据...</h2>
                <div class="status-indicator status-active">
                    <span class="indicator active"></span>
                    <span id="serverStatus">在线</span>
                </div>
            </div>
            
            <div class="stats-grid">
                <div class="stat-box highlighted">
                    <div class="stat-label"><i class="fas fa-users"></i> 在 线</div>
                    <div class="stat-value" id="playerCount">-/-</div>
                </div>
                
                <div class="stat-box highlighted">
                    <div class="stat-label"><i class="far fa-clock"></i> 服务器时间</div>
                    <div class="stat-value" id="serverTime">-</div>
                </div>
                
                <div class="stat-box">
                    <div class="stat-label"><i class="fas fa-gamepad"></i> 游戏版本</div>
                    <div class="stat-value" id="gameVersion">-</div>
                </div>
            </div>
            
            <div class="stats-details">
                <div class="detail-box">
                    <div class="detail-label"><i class="fas fa-network-wired"></i> 服务器IP</div>
                    <div class="detail-value" id="serverIP">-</div>
                </div>
                
                <div class="detail-box">
                    <div class="detail-label"><i class="fas fa-trophy"></i> 服务器排名</div>
                    <div class="detail-value">
                        <span id="serverRank">#-</span>
                    </div>
                </div>
                
                <div class="detail-box">
                    <div class="detail-label"><i class="fas fa-heartbeat"></i> 正常运行时间</div>
                    <div class="detail-value" id="uptime">-</div>
                </div>
                
                <div class="detail-box">
                    <div class="detail-label"><i class="fas fa-map-marker-alt"></i> 服务器位置</div>
                    <div class="detail-value">-</div>
                </div>
            </div>
        </div>
        
        <div class="control-panel">
            <div class="refresh-controls">
                <button class="refresh-btn" onclick="fetchServerInfo()">
                    <i class="fas fa-sync-alt"></i> 立即刷新
                </button>
                <select id="refreshInterval" onchange="updateRefreshInterval()">
                    <option value="5000">5秒刷新</option>
                    <option value="10000">10秒刷新</option>
                    <option value="30000">30秒刷新</option>
                    <option value="60000" selected>60秒刷新</option>
                </select>
                <span class="next-refresh">
                    下次刷新: <span id="nextRefreshTime" class="time-highlight">60</span> 秒后
                </span>
            </div>
        </div>
    </div>

    <script>
        let refreshTimer;
        let countdownTimer;
        let nextRefreshSeconds;

        // 模拟正常运行时间数据
        const getUptime = () => {
            return (Math.floor(Math.random() * 95) + 5 + Math.random()).toFixed(1) + '%';
        };

        function fetchServerInfo() {
            fetch('https://autorunner.eu.org/9996num/')
                .then(response => response.json())
                .then(data => {
                    document.getElementById('serverName').textContent = data.name;
                    document.getElementById('serverIP').textContent = `${data.ip}:${data.port}`;
                    document.getElementById('playerCount').textContent = `${data.players}/${data.maxPlayers}`;
                    document.getElementById('serverTime').textContent = data.time;
                    document.getElementById('gameVersion').textContent = data.version;
                    document.getElementById('serverRank').textContent = `#${data.rank}`;
                    document.getElementById('serverStatus').textContent = data.status;
                    document.getElementById('uptime').textContent = getUptime();
                    
                    // 更新状态指示器
                    const indicator = document.querySelector('.indicator');
                    const statusElement = document.querySelector('.status-indicator');
                    
                    if (data.status === "离线" || data.status === "down") {
                        indicator.className = 'indicator inactive';
                        statusElement.className = 'status-indicator status-inactive';
                    } else {
                        indicator.className = 'indicator active';
                        statusElement.className = 'status-indicator status-active';
                    }
                })
                .catch(error => {
                    console.error('获取服务器信息失败:', error);
                    document.getElementById('serverStatus').textContent = '连接失败';
                    document.querySelector('.indicator').className = 'indicator inactive';
                    document.querySelector('.status-indicator').className = 'status-indicator status-inactive';
                });
        }

        function updateCountdown() {
            document.getElementById('nextRefreshTime').textContent = nextRefreshSeconds;
            nextRefreshSeconds--;
            
            if (nextRefreshSeconds < 0) {
                nextRefreshSeconds = parseInt(document.getElementById('refreshInterval').value) / 1000;
            }
        }

        function updateRefreshInterval() {
            clearInterval(refreshTimer);
            clearInterval(countdownTimer);
            
            const interval = parseInt(document.getElementById('refreshInterval').value);
            nextRefreshSeconds = interval / 1000;
            
            refreshTimer = setInterval(fetchServerInfo, interval);
            countdownTimer = setInterval(updateCountdown, 1000);
            
            // 更新倒计时显示
            document.getElementById('nextRefreshTime').textContent = nextRefreshSeconds;
        }

        document.addEventListener('DOMContentLoaded', () => {
            fetchServerInfo();
            updateRefreshInterval();
            
            // 初始设置正常运行时间
            document.getElementById('uptime').textContent = getUptime();
        });
    </script>
</body>
</html>
