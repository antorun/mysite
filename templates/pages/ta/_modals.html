<!-- 令牌弹窗 -->
<div class="mask" id="keyMask">
  <div class="modal sm">
    <div class="modal-h"><span class="t">管理令牌</span><button class="x" data-close="keyMask">×</button></div>
    <div class="modal-b">
      <p class="c-dim" style="margin-bottom:11px;font-size:12px">
        令牌保存在手机上的 <code id="keyFileHint">~/.termux_admin_token</code>，
        也可以在 <code>mysite/.env</code> 里用 <code>TERMUX_ADMIN_TOKEN</code> 指定。
        浏览器会把令牌记在 localStorage，方便下次直接进入。
      </p>
      <input type="text" id="keyInput" class="mono" placeholder="粘贴令牌"
             autocapitalize="off" autocomplete="off" spellcheck="false">
      <p class="c-dim" style="margin-top:9px;font-size:11.5px" id="keyMsg"></p>
    </div>
    <div class="modal-f"><button class="btn pri" id="keySave">保存并验证</button></div>
  </div>
</div>

<!-- 编辑器 -->
<div class="mask" id="editMask">
  <div class="modal">
    <div class="modal-h"><span class="t mono" id="editTitle">文件</span>
      <button class="x" data-close="editMask">×</button></div>
    <div class="modal-b"><textarea id="editBody" spellcheck="false" autocapitalize="off"
      autocomplete="off"></textarea></div>
    <div class="modal-f">
      <span class="c-dim" style="font-size:11.5px;margin-right:auto" id="editInfo"></span>
      <button class="btn" id="editDownload">下载</button>
      <button class="btn pri" id="editSave">保存</button>
    </div>
  </div>
</div>

<!-- 文件预览（图片 / 视频 / 音频 / PDF） -->
<div class="mask" id="viewMask">
  <div class="modal lg">
    <div class="modal-h">
      <span class="t mono" id="viewTitle">预览</span>
      <span class="c-dim" style="font-size:11.5px" id="viewMeta"></span>
      <button class="x" data-close="viewMask">×</button>
    </div>
    <div class="modal-b viewbody" id="viewBody"></div>
    <div class="modal-f">
      <span class="c-dim" style="font-size:11.5px;margin-right:auto" id="viewHint"></span>
      <button class="btn" id="viewPrev" title="上一个（←）">‹ 上一个</button>
      <button class="btn" id="viewNext" title="下一个（→）">下一个 ›</button>
      <button class="btn" id="viewZoom" style="display:none">1:1</button>
      <button class="btn" id="viewOpen" style="display:none">新标签打开</button>
      <button class="btn" id="viewEdit" style="display:none">编辑</button>
      <button class="btn pri" id="viewDl">下载</button>
    </div>
  </div>
</div>

<!-- 输出弹窗（进程详情 / 通用输出） -->
<div class="mask" id="outMask">
  <div class="modal">
    <div class="modal-h"><span class="t" id="outTitle">输出</span>
      <button class="x" data-close="outMask">×</button></div>
    <div class="modal-b"><div id="outBody"></div></div>
  </div>
</div>

<!-- 输入弹窗 -->
<div class="mask" id="askMask">
  <div class="modal sm">
    <div class="modal-h"><span class="t" id="askTitle">输入</span>
      <button class="x" data-close="askMask">×</button></div>
    <div class="modal-b">
      <p class="c-dim" id="askDesc" style="margin-bottom:10px;font-size:12px"></p>
      <input type="text" id="askInput" autocomplete="off" spellcheck="false">
    </div>
    <div class="modal-f">
      <button class="btn" data-close="askMask">取消</button>
      <button class="btn pri" id="askOk">确定</button>
    </div>
  </div>
</div>

<div class="flash" id="flash"></div>
