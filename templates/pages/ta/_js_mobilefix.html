<script>
/* ------------------------------------------------------------------
   移动版式兜底
   手机浏览器开了「桌面版网站」，或本页被塞进一个比屏幕宽得多的 iframe 时，
   布局视口会远大于物理屏宽，上面的 @media(max-width:720px) 永远不会命中，
   于是手机上看到的是桌面版式（表现为"没适配手机"）。
   这里比对「布局视口宽度」与「物理屏宽」：前者明显更大就认定中了这种情形，
   把移动样式表的 media 改成 all 强制生效。桌面浏览器两项基本相等，不会误伤。
   ------------------------------------------------------------------ */
(function(){
  /* URL 上加 &m=1 可无条件强制移动版式（浏览器卡在桌面模式时的逃生口） */
  var forceByParam = /[?&]m=1(&|$)/.test(location.search);
  function fixMobile(){
    var el = document.getElementById('cssMobile');
    if(!el) return;
    var sw = (window.screen && screen.width) ? screen.width : 0;
    var iw = window.innerWidth || 0;
    /* 只对触摸设备（手机/平板）生效：桌面浏览器把窗口拖窄时 innerWidth 同样可能
       大于 screen.width，加这道门槛就不会误伤。 */
    var touch = false;
    try{
      touch = (window.matchMedia && matchMedia('(any-pointer: coarse)').matches)
           || ('ontouchstart' in window)
           || ((navigator.maxTouchPoints || 0) > 0);
    }catch(e){}
    var forced = forceByParam || !!(touch && sw && iw > Math.max(720, sw * 1.15));
    el.setAttribute('media', forced ? 'all' : '(max-width:720px)');
    var html = document.documentElement;
    if(forced) html.setAttribute('data-mobile-forced', '1');
    else html.removeAttribute('data-mobile-forced');
  }
  window.taFixMobile = fixMobile;      /* 便于在控制台手动重算 */
  fixMobile();
  window.addEventListener('resize', fixMobile);
  window.addEventListener('orientationchange', fixMobile);
})();
</script>
