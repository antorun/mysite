  <section class="panel" id="tab-terminal">
    <!-- 整块内容区就是终端本身：没有卡片外框，也没有窗口装饰条（三色圆点那种）。
         输出流铺满，输入行永远贴底，其余东西一律收进右下角的齿轮里。 -->
    <div class="term-win" id="tBody">
      <div class="term-scroll" id="termOut"></div>
      <div class="term-line" id="tLine">
        <span class="term-ps1 mono" id="tPs1">termux@localhost:~$</span>
        <span class="term-edit">
          <input type="text" id="tCmd" class="mono" aria-label="命令输入"
                 autocapitalize="off" autocorrect="off" autocomplete="off"
                 spellcheck="false" enterkeyhint="send">
          <span class="term-caret" id="tCaret" aria-hidden="true"></span>
        </span>
        <span class="term-rp">
          <span class="term-stat" id="tStat" data-s="idle" title="终端状态"><i></i><em>空闲</em></span>
          <button class="term-gear" id="tMenuBtn" type="button" aria-expanded="false"
                  title="终端设置（工作目录 / 超时 / 快捷命令）" aria-label="终端设置">⚙</button>
        </span>
      </div>

      <!-- 设置面板：真终端没有「工作目录 / 超时 / 快捷命令」这些东西，
           所以它们不该常年占着版面 —— 收在齿轮后面，点开才出现。 -->
      <div class="term-menu" id="tMenu" hidden role="dialog" aria-label="终端设置">
        <div class="tm-grp">
          <div class="tm-lab">工作目录</div>
          <input type="text" id="tCwd" class="mono" placeholder="工作目录"
                 autocapitalize="off" autocomplete="off" spellcheck="false">
        </div>
        <div class="tm-grp tm-inline">
          <div class="tm-lab">超时（秒）</div>
          <input type="number" id="tTimeout" value="30" min="1" max="180" class="mono"
                 inputmode="numeric" title="单条命令超时（秒）">
          <button class="btn" id="tClear" type="button" title="清屏（Ctrl+L）">清屏</button>
        </div>
        <div class="tm-lab">快捷命令</div>
        <div class="term-presets" id="tPresets"></div>
      </div>
    </div>
  </section>
