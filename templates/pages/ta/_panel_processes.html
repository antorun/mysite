  <section class="panel" id="tab-processes">
    <div class="card">
      <div class="card-h"><span class="t">进程列表</span></div>
      <div class="toolbar tb-2">
        <select id="psSort" class="w-md">
          <option value="cpu">按 CPU</option><option value="mem">按内存</option></select>
        <input type="text" id="psFilter" class="grow" placeholder="过滤命令…"
               autocapitalize="off" autocomplete="off" spellcheck="false">
        <button class="btn" id="psReload">刷新</button>
      </div>
      <div class="tw"><table><thead><tr>
        <th class="num">PID</th><th class="m-hide">用户</th><th class="num">CPU%</th>
        <th class="num">内存%</th><th class="num">RSS</th><th>状态</th>
        <th>运行</th><th>命令</th><th class="act">操作</th></tr></thead>
        <tbody id="psRows"><tr><td colspan="9" class="empty">加载中…</td></tr></tbody></table></div>
    </div>
  </section>
