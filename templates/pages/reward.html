<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>请求模拟面板 - 双请求监控</title>
    <style>
        :root {
            --bg: #0d1117;
            --card-bg: #161b22;
            --border: #30363d;
            --text: #c9d1d9;
            --text-secondary: #8b949e;
            --accent1: #58a6ff;
            --accent2: #3fb950;
            --success: #3fb950;
            --error: #f85149;
            --warning: #d2991d;
            --hover: #1c2333;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 24px;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 32px;
        }

        header h1 {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent1), var(--accent2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }

        header p {
            color: var(--text-secondary);
            font-size: 14px;
        }

        .dashboard {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            margin-bottom: 24px;
        }

        .panel {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.3);
        }

        .panel-header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .panel-header .title-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .panel-header .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .badge-file1 {
            background: rgba(59, 130, 246, 0.2);
            color: #60a5fa;
            border: 1px solid rgba(59, 130, 246, 0.3);
        }

        .badge-file2 {
            background: rgba(16, 185, 129, 0.2);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .panel-header h2 {
            font-size: 18px;
            font-weight: 600;
        }

        .controls {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 8px 20px;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }

        .btn-start {
            background: var(--accent1);
            color: white;
        }
        .btn-start:hover {
            background: #2563eb;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
        }
        .btn-start2 {
            background: var(--accent2);
            color: white;
        }
        .btn-start2:hover {
            background: #059669;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.4);
        }
        .btn-reset {
            background: var(--border);
            color: var(--text);
        }
        .btn-reset:hover {
            background: #475569;
        }
        .btn-start-all {
            background: linear-gradient(135deg, var(--accent1), var(--accent2));
            color: white;
            font-size: 14px;
            padding: 10px 28px;
            border-radius: 10px;
        }
        .btn-start-all:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 16px rgba(99, 102, 241, 0.5);
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }
        .btn-pause {
            background: #f59e0b;
            color: #0f172a;
        }
        .btn-pause:hover {
            background: #d97706;
        }
        .btn-resume {
            background: #8b5cf6;
            color: white;
        }
        .btn-resume:hover {
            background: #7c3aed;
        }
        .btn-pause2 {
            background: #f59e0b;
            color: #0f172a;
        }
        .btn-pause2:hover {
            background: #d97706;
        }
        .btn-resume2 {
            background: #8b5cf6;
            color: white;
        }
        .btn-resume2:hover {
            background: #7c3aed;
        }

        .stats-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1px;
            background: var(--border);
        }

        .stat-item {
            background: var(--card-bg);
            padding: 16px;
            text-align: center;
        }

        .stat-label {
            font-size: 11px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .stat-value {
            font-size: 24px;
            font-weight: 700;
        }

        .stat-value.success { color: var(--success); }
        .stat-value.error { color: var(--error); }
        .stat-value.pending { color: var(--warning); }
        .stat-value.time { color: var(--text); }

        .progress-bar {
            height: 4px;
            background: var(--border);
        }
        .progress-fill {
            height: 100%;
            transition: width 0.3s ease;
            border-radius: 0 2px 2px 0;
        }
        .progress-fill.file1 { background: var(--accent1); }
        .progress-fill.file2 { background: var(--accent2); }

        .list-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 16px 6px;
            cursor: pointer;
            user-select: none;
        }
        .list-header:hover .toggle-icon {
            color: #e2e8f0;
        }
        .toggle-icon {
            font-size: 14px;
            color: var(--text-secondary);
            transition: transform 0.3s ease, color 0.2s;
            display: inline-block;
        }
        .toggle-icon.collapsed {
            transform: rotate(-90deg);
        }
        .toggle-label {
            font-size: 12px;
            color: var(--text-secondary);
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .requests-container {
            max-height: 520px;
            overflow-y: auto;
            padding: 8px 16px 16px;
            transition: max-height 0.35s ease, padding 0.35s ease, opacity 0.25s ease;
        }
        .requests-container.collapsed {
            max-height: 0;
            padding-top: 0;
            padding-bottom: 0;
            overflow: hidden;
            opacity: 0;
        }

        .requests-container::-webkit-scrollbar {
            width: 6px;
        }
        .requests-container::-webkit-scrollbar-track {
            background: transparent;
        }
        .requests-container::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
        }

        .request-row {
            display: flex;
            align-items: center;
            padding: 10px 14px;
            margin: 4px 0;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid transparent;
            transition: all 0.2s;
            gap: 12px;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .request-row:hover {
            background: var(--hover);
            border-color: var(--border);
        }
        .request-row.loading {
            background: rgba(59, 130, 246, 0.05);
            border-color: rgba(59, 130, 246, 0.2);
        }
        .request-row.loading2 {
            background: rgba(16, 185, 129, 0.05);
            border-color: rgba(16, 185, 129, 0.2);
        }
        .request-row.success-row {
            border-color: rgba(34, 197, 94, 0.3);
            background: rgba(34, 197, 94, 0.05);
        }
        .request-row.error-row {
            border-color: rgba(239, 68, 68, 0.3);
            background: rgba(239, 68, 68, 0.05);
        }

        .req-index {
            font-size: 12px;
            font-weight: 700;
            min-width: 32px;
            color: var(--text-secondary);
        }

        .req-status {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .req-status.idle { background: var(--border); }
        .req-status.running { background: var(--accent1); animation: pulse 1s infinite; }
        .req-status.running2 { background: var(--accent2); animation: pulse 1s infinite; }
        .req-status.ok { background: var(--success); }
        .req-status.fail { background: var(--error); }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .req-method {
            font-size: 11px;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 4px;
            text-transform: uppercase;
        }
        .method-post { background: rgba(249, 168, 37, 0.2); color: #fbbf24; }
        .method-get { background: rgba(34, 197, 94, 0.2); color: #4ade80; }

        .req-path {
            font-size: 12px;
            color: var(--text-secondary);
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .req-time {
            font-size: 11px;
            font-weight: 600;
            min-width: 55px;
            text-align: right;
        }

        .req-code {
            font-size: 11px;
            font-weight: 700;
            min-width: 40px;
            text-align: center;
            padding: 2px 6px;
            border-radius: 4px;
        }
        .req-code.s200 { background: rgba(34, 197, 94, 0.2); color: #4ade80; }
        .req-code.serr { background: rgba(239, 68, 68, 0.2); color: #f87171; }

        .global-controls {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .summary-bar {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px 24px;
            display: flex;
            justify-content: center;
            gap: 40px;
            flex-wrap: wrap;
        }

        .summary-item {
            text-align: center;
        }
        .summary-item .label {
            font-size: 11px;
            color: var(--text-secondary);
            letter-spacing: 0.5px;
        }
        .summary-item .value {
            font-size: 22px;
            font-weight: 700;
        }

        .tooltip {
            position: relative;
            cursor: help;
            border-bottom: 1px dashed var(--text-secondary);
        }

        @media (max-width: 1024px) {
            body { padding: 12px; }
            .dashboard { grid-template-columns: 1fr; gap: 16px; }
            .stats-row { grid-template-columns: repeat(3, 1fr); }
            header { margin-bottom: 20px; }
            header h1 { font-size: 22px; }
            header p { font-size: 12px; }
        }

        @media (max-width: 640px) {
            body { padding: 8px; }
            header h1 { font-size: 18px; }
            header p { font-size: 11px; }
            .dashboard { gap: 12px; }
            .panel { border-radius: 12px; }
            .panel-header { padding: 12px 14px; gap: 8px; }
            .panel-header h2 { font-size: 15px; }
            .panel-header .badge { font-size: 10px; padding: 2px 8px; }
            .controls { gap: 4px; }
            .btn {
                padding: 6px 12px;
                font-size: 11px;
                border-radius: 6px;
            }
            .btn-start-all {
                font-size: 12px;
                padding: 8px 18px;
            }
            .stats-row { grid-template-columns: repeat(3, 1fr); }
            .stat-item { padding: 10px 6px; }
            .stat-label { font-size: 9px; letter-spacing: 0.5px; }
            .stat-value { font-size: 18px; }
            .list-header { padding: 8px 14px 4px; }
            .toggle-label { font-size: 11px; }
            .toggle-icon { font-size: 12px; }
            .requests-container { max-height: 360px; padding: 4px 8px 8px; }
            .request-row { padding: 8px 10px; gap: 6px; }
            .req-index { font-size: 10px; min-width: 24px; }
            .req-method { font-size: 9px; padding: 1px 5px; }
            .req-path { font-size: 10px; }
            .req-time { font-size: 10px; min-width: 48px; }
            .req-status { width: 6px; height: 6px; }
            .global-controls { gap: 8px; margin-bottom: 16px; }
            .summary-bar { padding: 12px 16px; gap: 16px; }
            .summary-item .label { font-size: 10px; }
            .summary-item .value { font-size: 18px; }
            .title-area { gap: 6px; }
            .tooltip { display: none; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🔬 请求模拟监控面板</h1>
            <p>每个文件模拟发送 <strong>21 次</strong> 请求 · 实时显示响应状态与耗时</p>
        </header>

        <div class="global-controls">
            <button class="btn btn-start-all" onclick="startAll()" id="btnStartAll">
                🚀 同时启动全部 (42 请求)
            </button>
        </div>

        <div class="dashboard">
            <!-- Panel 1: 111.txt -->
            <div class="panel" id="panel1">
                <div class="panel-header">
                    <div class="title-area">
                        <span class="badge badge-file1">FILE 1</span>
                        <h2>111.txt</h2>
                        <span class="tooltip" title="POST api-access.pangolin-sdk-toutiao.com">📋</span>
                    </div>
                    <div class="controls">
                        <button class="btn btn-start" onclick="startFile(0)" id="btnStart1">▶ 启动 21 次</button>
                        <button class="btn btn-pause" onclick="pauseFile(0)" id="btnPause1" style="display:none">⏸ 暂停</button>
                        <button class="btn btn-resume" onclick="resumeFile(0)" id="btnResume1" style="display:none">▶ 继续</button>
                    </div>
                </div>
                <div class="stats-row">
                    <div class="stat-item">
                        <div class="stat-label">进度</div>
                        <div class="stat-value pending" id="progress1">0/21</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">成功</div>
                        <div class="stat-value success" id="success1">0</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">失败</div>
                        <div class="stat-value error" id="fail1">0</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">平均耗时</div>
                        <div class="stat-value time" id="avgTime1">0ms</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">最快</div>
                        <div class="stat-value time" id="minTime1">0ms</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">最慢</div>
                        <div class="stat-value time" id="maxTime1">0ms</div>
                    </div>
                </div>
                <div class="progress-bar"><div class="progress-fill file1" id="progressBar1" style="width:0%"></div></div>
                <div class="list-header" onclick="toggleList(0)">
                    <span class="toggle-label">📋 请求列表</span>
                    <span class="toggle-icon" id="toggleIcon1">▼</span>
                </div>
                <div class="requests-container" id="requests1"></div>
            </div>

            <!-- Panel 2: 222.txt -->
            <div class="panel" id="panel2">
                <div class="panel-header">
                    <div class="title-area">
                        <span class="badge badge-file2">FILE 2</span>
                        <h2>222.txt</h2>
                        <span class="tooltip" title="POST api-access.pangolin-sdk-toutiao.com">📋</span>
                    </div>
                    <div class="controls">
                        <button class="btn btn-start2" onclick="startFile(1)" id="btnStart2">▶ 启动 21 次</button>
                        <button class="btn btn-pause2" onclick="pauseFile(1)" id="btnPause2" style="display:none">⏸ 暂停</button>
                        <button class="btn btn-resume2" onclick="resumeFile(1)" id="btnResume2" style="display:none">▶ 继续</button>
                    </div>
                </div>
                <div class="stats-row">
                    <div class="stat-item">
                        <div class="stat-label">进度</div>
                        <div class="stat-value pending" id="progress2">0/21</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">成功</div>
                        <div class="stat-value success" id="success2">0</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">失败</div>
                        <div class="stat-value error" id="fail2">0</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">平均耗时</div>
                        <div class="stat-value time" id="avgTime2">0ms</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">最快</div>
                        <div class="stat-value time" id="minTime2">0ms</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">最慢</div>
                        <div class="stat-value time" id="maxTime2">0ms</div>
                    </div>
                </div>
                <div class="progress-bar"><div class="progress-fill file2" id="progressBar2" style="width:0%"></div></div>
                <div class="list-header" onclick="toggleList(1)">
                    <span class="toggle-label">📋 请求列表</span>
                    <span class="toggle-icon" id="toggleIcon2">▼</span>
                </div>
                <div class="requests-container" id="requests2"></div>
            </div>
        </div>

        <div class="summary-bar">
            <div class="summary-item">
                <div class="label">总计请求</div>
                <div class="value" style="color: #e2e8f0;">42</div>
            </div>
            <div class="summary-item">
                <div class="label">总成功</div>
                <div class="value" style="color: #22c55e;" id="totalSuccess">0</div>
            </div>
            <div class="summary-item">
                <div class="label">总失败</div>
                <div class="value" style="color: #ef4444;" id="totalFail">0</div>
            </div>
            <div class="summary-item">
                <div class="label">总平均耗时</div>
                <div class="value" style="color: #94a3b8;" id="totalAvgTime">0ms</div>
            </div>
        </div>
    </div>

    <script>
        // ===== 请求数据定义 (直接从 HAR 提取) =====
        // 原始 headers: user-agent, x-pglcypher, content-type, content-length, accept-encoding
        // (+4个 HTTP/2 伪头部浏览器自动处理)
        const PROXY_URL = '/reward_proxy/';

        const requestData1 = {
            method: "POST",
            headers: [
                ["x-pglcypher", "4"],
                ["content-type", "application/octet-stream"],
                ["accept-encoding", "gzip"]
            ],
            body: "BNGoPFTjRQgoAhjSe4MG7kpq9PYRpUcxXruUlMPAbmUBTIFCWvH5o7gg0w6idt8H5sDHCJ0Mk+H4iKYAXgIgGgViJswaZVQcSQCjkGEOaTNN/2pnaNSgekGeMGAfEjn4x9ryHQgKsBDgp0rBeL5rTacUcYDsU2jPTVWJvdlj28h0Aai9oMRr4mjxMG/Cxs8FGR/QOGsvmi7mlJfFvo13RrlkaL/LDKAXm8JTXseIhHNy7tUDKmJSbm3DPrZyD1HZz0XQxI1f43/1bR0A+1xKDJNG70L12HUBJypO8uZt+6E4fmKTECnojv9mGrpOs2aed6BH0GAOsU7OQZcB7u7d/G8a/YNx163zlTKs0E3SK1eQj2KS55n7BnZHtHD2wlNIAGZRmc4D/lPYCRKkNceQ4uTctrejikpwi8SK2owmgo0qvfTVTazfe+49yfJn+PgpJJ+iva/U6RASMBJ3vmuJYbcRuH4QNIBHKA2bkcDPRrh7qn48smELwMFOurBUG9Bo2w=="
        };

        const requestData2 = {
            method: "POST",
            headers: [
                ["x-pglcypher", "4"],
                ["content-type", "application/octet-stream"],
                ["accept-encoding", "gzip"]
            ],
            body: "BCHWWgpyf/v//9mZLYnTtFe1USwqqXssq+qwDtRU+36EMTbbHCGoAXxkwypwrFZn+1dRrdxBH/AVI0YxVFMFPrPmrY6mksrB2Sqm9E+mo0L2wws0snSqe83G4GXDBPsmo5Zmspe4p6zojqRWfEGXvfxw4JHhDoDNnAYcZN/G3M3gjJnyP3wn6VKcdGigMxINIjuoVNhUc6zzU65EQpWnfYRq0wb5BPvxiIkQzaKCIBwFiG3PwUgYEYiDbREVZo1hN/XZQsuJTur4JuKs1qj9YGQCqhXP1CSn2ONZHypawcSqb7ZDxk+9n6VlYFPLkauNw3bX6vcgROElpZKnPicvJQ/c/B95HBz+tRbMdTKLklTCptQ/n3A27AEzf8qWt0F6G3Pr12KQtKANrjOaiB97sUsfpxw/yxAA8e+UL0uyAorkoQvQ3FeUc+7K1vvuL8l1Ms7AEKsyQuvzkfgx1HscLwfmcDXm/JcuRznvpZ3yO/7NSd6us+oEfMUvBkleeP/KXg=="
        };

        function getRequestUrl() {
            return PROXY_URL;
        }

        const TOTAL_REQUESTS = 21;

        // 状态管理 - results 存储 { status, time, bodySize }
        const state = [
            { running: false, paused: false, currentIndex: 0, sentCount: 0, results: [], startTime: 0, pauseResolve: null },
            { running: false, paused: false, currentIndex: 0, sentCount: 0, results: [], startTime: 0, pauseResolve: null }
        ];

        // ===== 初始化渲染 =====
        function renderRequests(fileIndex) {
            const containerId = `requests${fileIndex + 1}`;
            const container = document.getElementById(containerId);
            const st = state[fileIndex];
            let html = '';
            for (let i = 0; i < TOTAL_REQUESTS; i++) {
                const result = st.results[i];
                let rowClass = '';
                let statusClass = 'idle';
                let timeText = '--';
                let codeHtml = '';

                if (result) {
                    if (result.status >= 200 && result.status < 300) {
                        rowClass = 'success-row';
                        statusClass = 'ok';
                    } else {
                        rowClass = 'error-row';
                        statusClass = 'fail';
                    }
                    timeText = result.time + 'ms';
                    codeHtml = `<span class="req-code ${result.status === 200 ? 's200' : 'serr'}" title="${escapeHtml(result.error || '')}">${result.status}</span>`;
                } else if (st.running && i === st.currentIndex && !st.paused) {
                    rowClass = fileIndex === 0 ? 'loading' : 'loading2';
                    statusClass = fileIndex === 0 ? 'running' : 'running2';
                    timeText = '发送中...';
                }

                html += `
                    <div class="request-row ${rowClass}">
                        <span class="req-index">#${String(i + 1).padStart(2, '0')}</span>
                        <span class="req-status ${statusClass}"></span>
                        <span class="req-method method-post">POST</span>
                        <span class="req-path">/api/ad/union/mediation/reward_video/reward/</span>
                        ${codeHtml}
                        <span class="req-time">${timeText}</span>
                    </div>`;
            }
            container.innerHTML = html;
        }

        function updateStats(fileIndex) {
            const st = state[fileIndex];
            const results = st.results.filter(r => r !== undefined);
            const sid = fileIndex + 1;
            const completed = results.length;

            document.getElementById(`progress${sid}`).textContent = `${completed}/${TOTAL_REQUESTS}`;

            const successCount = results.filter(r => r.status >= 200 && r.status < 300).length;
            const failCount = results.filter(r => r.status < 200 || r.status >= 300).length;
            document.getElementById(`success${sid}`).textContent = successCount;
            document.getElementById(`fail${sid}`).textContent = failCount;

            if (results.length > 0) {
                const times = results.map(r => r.time);
                const avg = Math.round(times.reduce((a, b) => a + b, 0) / times.length);
                const min = Math.min(...times);
                const max = Math.max(...times);
                document.getElementById(`avgTime${sid}`).textContent = avg + 'ms';
                document.getElementById(`minTime${sid}`).textContent = min + 'ms';
                document.getElementById(`maxTime${sid}`).textContent = max + 'ms';
            }

            document.getElementById(`progressBar${sid}`).style.width = ((completed / TOTAL_REQUESTS) * 100) + '%';

            // 更新按钮状态
            const btnStart = document.getElementById(`btnStart${sid}`);
            const btnPause = document.getElementById(`btnPause${sid}`);
            const btnResume = document.getElementById(`btnResume${sid}`);

            if (st.running && !st.paused) {
                btnStart.style.display = 'none';
                btnPause.style.display = '';
                btnResume.style.display = 'none';
            } else if (st.running && st.paused) {
                btnStart.style.display = 'none';
                btnPause.style.display = 'none';
                btnResume.style.display = '';
            } else {
                btnStart.style.display = '';
                btnPause.style.display = 'none';
                btnResume.style.display = 'none';
            }

            updateGlobalStats();
        }

        function updateGlobalStats() {
            const allResults = [...state[0].results.filter(r => r), ...state[1].results.filter(r => r)];
            const successCount = allResults.filter(r => r.status >= 200 && r.status < 300).length;
            const failCount = allResults.filter(r => r.status < 200 || r.status >= 300).length;
            document.getElementById('totalSuccess').textContent = successCount;
            document.getElementById('totalFail').textContent = failCount;

            if (allResults.length > 0) {
                const times = allResults.map(r => r.time);
                const avg = Math.round(times.reduce((a, b) => a + b, 0) / times.length);
                document.getElementById('totalAvgTime').textContent = avg + 'ms';
            }

            document.getElementById('btnStartAll').disabled = state[0].running || state[1].running;
        }

        function escapeHtml(str) {
            if (!str) return '';
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        // ===== 发送请求 =====
        async function fireRequest(fileIndex, requestIndex) {
            const data = fileIndex === 0 ? requestData1 : requestData2;
            const startTime = performance.now();

            try {
                const result = await doXHR(PROXY_URL, data.method, data.headers, data.body, 10000);
                const elapsed = Math.round(performance.now() - startTime);
                state[fileIndex].results[requestIndex] = { ...result, time: elapsed };
            } catch (e) {
                const elapsed = Math.round(performance.now() - startTime);
                state[fileIndex].results[requestIndex] = { status: 0, time: elapsed, error: e.message };
            }
        }

        function doXHR(url, method, headers, body, timeout) {
            return new Promise((resolve, reject) => {
                const binaryString = atob(body);
                const bytes = new Uint8Array(binaryString.length);
                for (let i = 0; i < binaryString.length; i++) {
                    bytes[i] = binaryString.charCodeAt(i);
                }

                const xhr = new XMLHttpRequest();
                xhr.open(method, url, true);

                for (let i = 0; i < headers.length; i++) {
                    const name = headers[i][0];
                    const value = headers[i][1];
                    try { xhr.setRequestHeader(name, value); } catch(e) {}
                }

                xhr.onreadystatechange = function() {
                    if (xhr.readyState === 4) {
                        let errorMsg = '';
                        if (xhr.status < 200 || xhr.status >= 300) {
                            try {
                                const errObj = JSON.parse(xhr.responseText);
                                errorMsg = errObj.error || errObj.type || '';
                            } catch(e) {
                                errorMsg = xhr.responseText ? xhr.responseText.substring(0, 200) : '';
                            }
                        }
                        resolve({
                            status: xhr.status,
                            bodySize: xhr.responseText ? xhr.responseText.length : 0,
                            error: errorMsg
                        });
                    }
                };

                xhr.onerror = function() {
                    reject(new Error('Network Error'));
                };

                xhr.ontimeout = function() {
                    reject(new Error('Timeout'));
                };

                xhr.timeout = timeout;
                xhr.send(bytes.buffer);
            });
        }

        // ===== 启动文件的所有请求 (支持暂停/继续) =====
        async function startFile(fileIndex) {
            const st = state[fileIndex];
            if (st.running && !st.paused) return;

            if (!st.running) {
                st.running = true;
                st.paused = false;
                st.currentIndex = 0;
                st.sentCount = 0;
                st.results = [];
                st.startTime = performance.now();
            } else if (st.paused) {
                st.paused = false;
            }

            renderRequests(fileIndex);
            updateStats(fileIndex);

            for (let i = st.currentIndex; i < TOTAL_REQUESTS; i++) {
                st.currentIndex = i;

                // 检查暂停
                if (st.paused) {
                    renderRequests(fileIndex);
                    updateStats(fileIndex);
                    return;
                }

                // 发送请求并等待响应
                renderRequests(fileIndex);
                await fireRequest(fileIndex, i);
                st.sentCount = i + 1;
                st.currentIndex = i + 1;
                renderRequests(fileIndex);
                updateStats(fileIndex);

                // 间隔 1-3s（最后一条不需要）
                if (i < TOTAL_REQUESTS - 1) {
                    const delay = Math.floor(Math.random() * 2000) + 1000;
                    const checkInterval = 200;
                    let waited = 0;
                    while (waited < delay) {
                        if (st.paused) {
                            renderRequests(fileIndex);
                            updateStats(fileIndex);
                            return;
                        }
                        const step = Math.min(checkInterval, delay - waited);
                        await sleep(step);
                        waited += step;
                    }
                }
            }

            st.running = false;
            st.paused = false;
            renderRequests(fileIndex);
            updateStats(fileIndex);
        }

        function pauseFile(fileIndex) {
            const st = state[fileIndex];
            if (st.running && !st.paused) {
                st.paused = true;
                renderRequests(fileIndex);
                updateStats(fileIndex);
            }
        }

        function resumeFile(fileIndex) {
            const st = state[fileIndex];
            if (st.running && st.paused) {
                st.paused = false;
                // 从当前索引继续
                startFile(fileIndex);
            }
        }

        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        // ===== 同时启动全部 =====
        async function startAll() {
            if (state[0].running || state[1].running) return;
            await Promise.all([startFile(0), startFile(1)]);
        }

        // ===== 折叠/展开请求列表 =====
        const listCollapsed = [true, true];

        function toggleList(fileIndex) {
            listCollapsed[fileIndex] = !listCollapsed[fileIndex];
            const container = document.getElementById(`requests${fileIndex + 1}`);
            const icon = document.getElementById(`toggleIcon${fileIndex + 1}`);
            if (listCollapsed[fileIndex]) {
                container.classList.add('collapsed');
                icon.classList.add('collapsed');
            } else {
                container.classList.remove('collapsed');
                icon.classList.remove('collapsed');
            }
        }

        // ===== 页面初始化 =====
        renderRequests(0);
        renderRequests(1);
        updateStats(0);
        updateStats(1);
        // 默认折叠
        document.getElementById('requests1').classList.add('collapsed');
        document.getElementById('toggleIcon1').classList.add('collapsed');
        document.getElementById('requests2').classList.add('collapsed');
        document.getElementById('toggleIcon2').classList.add('collapsed');
    </script>
</body>
</html>
