<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - 页面未找到</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            color: #4a5568;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            line-height: 1.6;
            padding: 15px;
        }

        .error-container {
            text-align: center;
            width: 100%;
            max-width: 600px;
            padding: 30px 20px;
            border-radius: 16px;
            background-color: rgba(255, 255, 255, 0.95);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.08);
            transform: translateY(0);
            transition: transform 0.3s ease;
            position: relative;
            margin: 20px 0;
        }

        .error-container:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.12);
        }

        .icon-container {
            margin: 0 auto 25px;
            width: 100px;
            height: 100px;
            position: relative;
        }

        .error-icon {
            width: 100%;
            height: 100%;
            background-color: #f8d7da;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 54px;
            color: #dc3545;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
            border: 3px solid #dc3545;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); }
            50% { transform: scale(1); }
            100% { transform: scale(0.95); }
        }

        .error-icon::after {
            content: '?';
            font-weight: bold;
        }

        h1 {
            font-size: 2rem;
            color: #2d3748;
            margin-bottom: 12px;
            font-weight: 700;
        }

        .error-message {
            font-size: 1.1rem;
            margin-bottom: 25px;
            color: #4a5568;
        }

        .explanation {
            background-color: #f8f9fa;
            padding: 15px;
            border-radius: 12px;
            text-align: left;
            margin: 20px 0;
            border-left: 4px solid #4299e1;
        }

        .explanation h3 {
            color: #2b6cb0;
            margin-bottom: 12px;
            font-size: 1.1rem;
        }

        .explanation ul {
            padding-left: 20px;
            margin-top: 8px;
        }

        .explanation li {
            margin-bottom: 8px;
            font-size: 0.95rem;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 25px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 20px;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #4299e1 0%, #3182ce 100%);
            color: white;
            box-shadow: 0 4px 12px rgba(66, 153, 225, 0.4);
        }

        .btn-primary:hover, .btn-primary:active {
            transform: translateY(-3px);
            box-shadow: 0 7px 15px rgba(66, 153, 225, 0.5);
        }

        .btn-secondary {
            background: linear-gradient(135deg, #edf2f7 0%, #e2e8f0 100%);
            color: #4a5568;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.08);
        }

        .btn-secondary:hover, .btn-secondary:active {
            background: linear-gradient(135deg, #e2e8f0 0%, #cbd5e0 100%);
            transform: translateY(-3px);
        }

        .contact {
            margin-top: 20px;
            font-size: 0.9rem;
            color: #718096;
        }

        .contact a {
            color: #4299e1;
            text-decoration: none;
            border-bottom: 1px dashed;
            transition: color 0.2s;
        }

        .contact a:hover {
            color: #2b6cb0;
            border-bottom-style: solid;
        }

        footer {
            position: static;
            margin-top: auto;
            text-align: center;
            font-size: 0.8rem;
            color: #a0aec0;
            padding: 15px 0;
            width: 100%;
        }

        /* 移动端优先样式（不需要媒体查询） */
        body {
            padding: 10px;
        }
        
        .error-container {
            padding: 25px 15px;
            border-radius: 14px;
        }
        
        .icon-container {
            width: 90px;
            height: 90px;
            margin-bottom: 20px;
        }
        
        .error-icon {
            font-size: 48px;
        }
        
        h1 {
            font-size: 1.7rem;
        }
        
        .error-message {
            font-size: 1rem;
            margin-bottom: 20px;
        }
        
        .explanation {
            padding: 12px 15px;
            margin: 15px 0;
        }
        
        .explanation h3 {
            font-size: 1rem;
        }
        
        .explanation li {
            font-size: 0.9rem;
        }
        
        .buttons {
            flex-direction: column;
            align-items: center;
            gap: 10px;
            margin-top: 20px;
        }
        
        .btn {
            width: 100%;
            max-width: 260px;
            padding: 12px;
        }

        /* 平板/桌面样式 */
        @media (min-width: 600px) {
            .error-container {
                padding: 40px 30px;
            }
            
            .icon-container {
                width: 120px;
                height: 120px;
            }
            
            .error-icon {
                font-size: 64px;
            }
            
            h1 {
                font-size: 2.5rem;
            }
            
            .error-message {
                font-size: 1.3rem;
            }
            
            .explanation {
                padding: 20px;
            }
            
            .explanation h3 {
                font-size: 1.2rem;
            }
            
            .explanation li {
                font-size: 1rem;
            }
            
            .buttons {
                flex-direction: row;
                gap: 20px;
            }
            
            .btn {
                padding: 14px 28px;
                max-width: none;
                width: auto;
            }
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="icon-container">
            <div class="error-icon"></div>
        </div>
        
        <h1>404 - 页面未找到</h1>
        
        <p class="error-message">抱歉，您请求的页面不存在或已被移除</p>
        
        <div class="explanation">
            <h3>可能的原因：</h3>
            <ul>
                <li>您输入的网址可能有拼写错误</li>
                <li>此页面可能已被删除或迁移</li>
                <li>该资源可能已被永久移除</li>
                <li>您可能通过过时的链接访问</li>
            </ul>
        </div>
        
        <div class="buttons">
            <button class="btn btn-primary" onclick="location.reload()">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M1 4v6h6"></path>
                    <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>
                </svg>
                刷新页面
            </button>
            
            <button class="btn btn-secondary" onclick="window.location.href='/'">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                    <polyline points="9 22 9 12 15 12 15 22"></polyline>
                </svg>
                返回首页
            </button>
        </div>
        
        <!-- <div class="contact">
            需要帮助？请联系 <a href="mailto:support@example.com">网站管理员</a>
        </div> -->
    </div>
    
    <footer>
        <p>© 2025 autorunner | 错误代码: HTTP 404</p>
    </footer>
</body>
</html>
