<!doctype html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>电台播放器</title>
    <style>
        :root {
            --bg: #0b0f13;
            --panel: #0f1418;
            --muted: #95a0a6;
            --accent: #1db954;
            --card: #111418;
        }

        html,
        body {
            height: 100%;
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial;
            background: var(--bg);
            color: #e6eef3
        }

        .wrap {
            display: flex;
            height: 100vh;
            gap: 20px;
            padding: 18px;
            box-sizing: border-box
        }

        .left {
            width: 320px;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.02), rgba(255, 255, 255, 0.01));
            border-radius: 8px;
            padding: 12px;
            box-sizing: border-box;
            overflow: auto
        }

        .right {
            flex: 1;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.01), rgba(255, 255, 255, 0.00));
            border-radius: 8px;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start
        }

        .title {
            font-size: 18px;
            font-weight: 600;
            margin: 6px 0 12px;
            color: #fff
        }

        .station {
            display: flex;
            gap: 12px;
            align-items: center;
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            margin-bottom: 8px
        }

        .station:hover {
            background: rgba(255, 255, 255, 0.02)
        }

        .station.active {
            background: rgba(29, 185, 84, 0.12);
            box-shadow: inset 0 0 0 1px rgba(29, 185, 84, 0.05)
        }

        .cover {
            width: 56px;
            height: 56px;
            border-radius: 6px;
            background: #222;
            flex: 0 0 56px;
            object-fit: cover
        }

        .meta {
            flex: 1;
            min-width: 0
        }

        .meta .name {
            font-size: 14px;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis
        }

        .meta .info {
            font-size: 12px;
            color: var(--muted);
            margin-top: 4px
        }

        .player-card {
            width: 100%;
            max-width: 820px;
            background: var(--card);
            border-radius: 10px;
            padding: 18px;
            box-sizing: border-box;
            display: flex;
            gap: 18px;
            align-items: center
        }

        .player-cover {
            width: 120px;
            height: 120px;
            border-radius: 8px;
            background: #222;
            object-fit: cover
        }

        .player-body {
            flex: 1
        }

        .player-body h2 {
            margin: 0;
            color: #fff;
            font-size: 20px
        }

        .player-body p {
            margin: 6px 0;
            color: var(--muted)
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 12px
        }

        .btn {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: #fff;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer
        }

        .btn.play {
            background: var(--accent);
            border: none;
            color: #06120b
        }

        .small {
            font-size: 13px;
            padding: 6px 8px
        }

        .progress {
            width: 220px
        }

        .right-bottom {
            margin-top: 18px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--muted)
        }

        a.link {
            color: var(--muted);
            text-decoration: none
        }

        /* scrollbar */
        .left::-webkit-scrollbar {
            width: 10px
        }

        .left::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 8px
        }

        @media(max-width:880px) {
            .left {
                width: 240px
            }

            .player-cover {
                display: none
            }
        }
    </style>
</head>

<body>
    <div class="wrap">
        <aside class="left">
            <div class="title">电台列表</div>
            <div id="stationList"></div>
        </aside>
        <main class="right">
            <div class="player-card">
                <img id="playerCover" class="player-cover" src="" alt="cover">
                <div class="player-body">
                    <h2 id="playerTitle">未选择电台</h2>
                    <p id="playerProgram">请选择左侧电台以开始播放</p>
                    <div class="controls">
                        <button id="playBtn" class="btn play">播放</button>
                        <button id="pauseBtn" class="btn small">暂停</button>
                        <label class="small" style="display:flex;align-items:center;gap:8px">音量 <input id="vol"
                                type="range" min="0" max="1" step="0.01" value="1"></label>
                        <div style="flex:1"></div>
                        <div class="small">状态: <span id="status">停止</span></div>
                    </div>
                    <div style="margin-top:10px;display:flex;gap:10px;align-items:center">
                        <input id="progress" class="progress" type="range" min="0" max="100" value="0">
                        <div class="small" id="time">--:--</div>
                    </div>
                </div>
            </div>
            <div class="right-bottom">
                <div class="small">Powered by 本地页面 · 支持 HLS（m3u8）</div>
                <div><a class="link" href="#" id="sourceLink">来源</a></div>
            </div>
        </main>
    </div>

    <!-- Hls.js for browsers without native HLS support -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script>
        // 示例数据（已简化），可替换为真实的 API 请求
        const sample = {
            data: {
                radios: [
                    { id: 1011, name: "清晨音乐台", coverSmall: "http://imagev2.xmcdn.com/group75/M06/1E/E6/wKgO3V6L9FHD0pQnAAJnjRFwGy8159.jpg", programName: "早安音乐秀", playCount: 1508567, playUrl: { aac24: "http://live.ximalaya.com/radio-first-page-app/live/1011/24.m3u8", aac64: "http://live.ximalaya.com/radio-first-page-app/live/1011/64.m3u8" } },
                    { id: 2022, name: "午间轻音乐", coverSmall: "https://picsum.photos/seed/2022/200/200", programName: "午安旋律", playCount: 420123, playUrl: { aac24: "http://live.ximalaya.com/radio-first-page-app/live/1011/24.m3u8" } },
                    { id: 3033, name: "深夜电台", coverSmall: "https://picsum.photos/seed/3033/200/200", programName: "夜听时光", playCount: 98012, playUrl: { aac24: "http://live.ximalaya.com/radio-first-page-app/live/1011/24.m3u8" } }
                ]
            }
        };

        const listEl = document.getElementById('stationList');
        const playerCover = document.getElementById('playerCover');
        const playerTitle = document.getElementById('playerTitle');
        const playerProgram = document.getElementById('playerProgram');
        const playBtn = document.getElementById('playBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const vol = document.getElementById('vol');
        const statusEl = document.getElementById('status');
        const sourceLink = document.getElementById('sourceLink');
        const progress = document.getElementById('progress');
        const time = document.getElementById('time');

        // shared audio element
        const audio = document.createElement('audio');
        audio.crossOrigin = 'anonymous';
        audio.preload = 'none';
        audio.controls = false;
        document.body.appendChild(audio);

        let hls = null;
        let currentStation = null;

        function formatNumber(n) { return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',') }

        // centralized status update
        function updateStatus(text) {
            statusEl.textContent = text;
        }

        // audio event listeners to keep status in sync
        audio.addEventListener('playing', () => updateStatus('播放中'));
        audio.addEventListener('pause', () => updateStatus('已暂停'));
        audio.addEventListener('waiting', () => updateStatus('缓冲中'));
        audio.addEventListener('stalled', () => updateStatus('缓冲中'));
        audio.addEventListener('ended', () => updateStatus('已结束'));
        audio.addEventListener('error', (e) => {
            console.error('Audio error', e);
            updateStatus('播放错误');
        });

        function buildList(radios) {
            listEl.innerHTML = '';
            radios.forEach((r, idx) => {
                const el = document.createElement('div');
                el.className = 'station';
                el.dataset.index = idx;
                el.innerHTML = `<img class="cover" src="${r.coverSmall}" alt="cover"><div class="meta"><div class="name">${r.name}</div><div class="info">${r.programName || ''} · 播放 ${formatNumber(r.playCount || 0)}</div></div>`;
                el.addEventListener('click', () => selectStation(idx, el));
                listEl.appendChild(el);
            });
        }

        function setActiveElement(elem) {
            document.querySelectorAll('.station').forEach(s => s.classList.remove('active'));
            if (elem) elem.classList.add('active');
        }

        function selectStation(index, elem) {
            const r = sample.data.radios[index];
            currentStation = r;
            setActiveElement(elem);
            playerCover.src = r.coverSmall || '';
            playerTitle.textContent = r.name;
            playerProgram.textContent = r.programName ? `${r.programName} · 播放 ${formatNumber(r.playCount || 0)}` : `播放 ${formatNumber(r.playCount || 0)}`;
            sourceLink.href = r.playUrl && (r.playUrl.aac64 || r.playUrl.aac24) ? (r.playUrl.aac64 || r.playUrl.aac24) : '#';
            loadStream(r.playUrl && (r.playUrl.aac64 || r.playUrl.aac24));
        }

        function loadStream(url) {
            if (!url) { alert('该电台没有可用播放地址'); return }
            // stop previous
            if (hls) { hls.destroy(); hls = null }
            audio.pause();
            audio.removeAttribute('src');
            audio.load();

            updateStatus('加载中');

            // Use native support when possible (Safari)
            if (audio.canPlayType('application/vnd.apple.mpegurl')) {
                audio.src = url;
                audio.play().then(() => { /* playing event will update status */ })
                    .catch(e => { console.warn(e); updateStatus('就绪'); });
            } else if (window.Hls) {
                hls = new Hls();
                hls.attachMedia(audio);
                hls.on(Hls.Events.MEDIA_ATTACHED, () => { hls.loadSource(url); });
                hls.on(Hls.Events.MANIFEST_PARSED, () => { audio.play().catch(() => { }); });
                hls.on(Hls.Events.ERROR, function (event, data) { console.error('HLS error', event, data); updateStatus('错误') })
            } else {
                // fallback: attempt to set src
                audio.src = url;
                audio.play().then(() => {/* playing event updates status */ }).catch(() => updateStatus('就绪'));
            }
        }

        playBtn.addEventListener('click', () => {
            if (!currentStation) {
                // auto select first
                const first = document.querySelector('.station');
                if (first) first.click();
                return;
            }
            updateStatus('尝试播放');
            audio.play().then(() => {/* playing event will set status */ }).catch(e => { console.warn(e); updateStatus('无法播放') })
        });
        pauseBtn.addEventListener('click', () => { audio.pause(); /* pause event will update status */ })
        vol.addEventListener('input', () => { audio.volume = parseFloat(vol.value) })

        // basic progress (HLS live streams may not provide duration)
        audio.addEventListener('timeupdate', () => {
            if (isFinite(audio.duration) && audio.duration > 0) {
                progress.max = 100; progress.value = (audio.currentTime / audio.duration) * 100;
                const s = Math.floor(audio.currentTime % 60).toString().padStart(2, '0');
                const m = Math.floor(audio.currentTime / 60).toString().padStart(2, '0');
                time.textContent = `${m}:${s}`;
            } else {
                progress.value = 0; time.textContent = '--:--';
            }
        });

        progress.addEventListener('input', () => {
            if (isFinite(audio.duration) && audio.duration > 0) {
                audio.currentTime = (progress.value / 100) * audio.duration;
            }
        });

        // initialize
        buildList(sample.data.radios);
        // pre-select first station (optional)
        // document.querySelector('.station')?.click();

    </script>
</body>

</html>
