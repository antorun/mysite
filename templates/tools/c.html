<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>颜色拾取 - 控制页面</title>
    <style>
        :root {
            --bg: #0d1117;
            --card-bg: #161b22;
            --border: #30363d;
            --text: #c9d1d9;
            --text-secondary: #8b949e;
            --accent: #58a6ff;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --radius: 8px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            height: 100%;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 24px 16px;
        }
        .controls {
            display: flex;
            flex-direction: column;
            gap: 14px;
            background: var(--card-bg);
            padding: 20px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            width: 100%;
            max-width: 560px;
        }
        .status {
            padding: 10px 14px;
            font-size: 0.85rem;
            border-radius: 6px;
            width: 100%;
            text-align: center;
            border: 1px solid var(--border);
            background: var(--bg);
        }
        .status.connected { color: var(--accent-green); border-color: var(--accent-green); }
        .status.disconnected { color: var(--accent-red); border-color: var(--accent-red); }

        .section { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .section label {
            font-size: 0.82rem;
            color: var(--text-secondary);
            white-space: nowrap;
            min-width: 90px;
        }
        button, input[type="color"] {
            padding: 10px 16px;
            font-size: 0.85rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.15s;
        }
        button {
            background: var(--card-bg);
            color: var(--text);
        }
        button:hover { border-color: var(--accent); color: var(--accent); }
        button.accent { background: var(--accent); border-color: var(--accent); color: #fff; }
        input[type="color"] {
            width: 44px;
            height: 44px;
            padding: 2px;
            background: transparent;
        }
        .preset-button {
            width: 44px;
            height: 44px;
            border: 2px solid var(--border);
            border-radius: 6px;
            cursor: pointer;
            transition: transform 0.15s, border-color 0.15s;
        }
        .preset-button:hover { transform: scale(1.1); border-color: var(--accent); }
        input[type="text"] {
            padding: 10px 14px;
            font-size: 0.85rem;
            width: 100%;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--bg);
            color: var(--text);
            font-family: inherit;
            outline: none;
            transition: border-color 0.15s;
        }
        input[type="text"]:focus { border-color: var(--accent); }
        input::placeholder { color: var(--text-secondary); }

        @media (max-width: 480px) {
            body { padding: 14px 10px; }
            .controls { padding: 14px; gap: 10px; }
            .section label { min-width: auto; font-size: 0.75rem; }
            button { padding: 8px 12px; font-size: 0.8rem; }
            input[type="color"] { width: 38px; height: 38px; }
            .preset-button { width: 38px; height: 38px; }
            input[type="text"] { font-size: 0.8rem; padding: 8px 10px; }
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jscolor/2.4.5/jscolor.min.js"></script>
</head>
<body>
    <div class="controls">
        <div id="server-status" class="status disconnected">未连接</div>
        <div class="section">
            <label>背景颜色</label>
            <input type="color" id="bg-color" value="#121212">
            <label>时间颜色</label>
            <input type="color" id="time-color" value="#ffffff">
        </div>
        <div class="section">
            <label>预设</label>
            <button class="preset-button" style="background:#000" data-bg="#000000" data-font="#888888"></button>
            <button class="preset-button" style="background:#2c2c2c" data-bg="#2c2c2c" data-font="#b0b0b0"></button>
            <button class="preset-button" style="background:#1a1a1a" data-bg="#1a1a1a" data-font="#cccccc"></button>
        </div>
        <input type="text" id="video-url" placeholder="输入视频地址或网页地址…">
        <div class="section">
            <button id="send-video">推送视频</button>
            <button id="show-player">显示视频</button>
            <button id="send-webpage">推送网页</button>
            <button id="show-webpage">显示网页</button>
            <button id="show-time" class="accent">显示时间</button>
        </div>
    </div>

    <script>
        var statusEl = document.getElementById('server-status');
        function setConnected(c) {
            statusEl.textContent = c ? '已连接' : '未连接';
            statusEl.className = 'status ' + (c ? 'connected' : 'disconnected');
        }
        var socket;
        try {
            socket = new WebSocket('ws://103.143.73.156:8080');
            socket.onopen = function() { setConnected(true); };
            socket.onclose = function() { setConnected(false); };
            socket.onerror = function() {};
            socket.onmessage = function(event) {
                try { JSON.parse(event.data); } catch(e) {}
            };
        } catch(e) { setConnected(false); }

        function send(msg) {
            if (socket && socket.readyState === WebSocket.OPEN) {
                socket.send(JSON.stringify(msg));
            }
        }

        document.getElementById('show-time').addEventListener('click', function() {
            send({ action: 'showElement', elementId: 'time' });
        });
        document.getElementById('bg-color').addEventListener('input', function() {
            send({ action: 'changeBackgroundColor', color: this.value });
        });
        document.getElementById('time-color').addEventListener('input', function() {
            send({ action: 'changeTimeColor', color: this.value });
        });
        document.querySelectorAll('.preset-button').forEach(function(btn) {
            btn.addEventListener('click', function() {
                send({ action: 'changeBackgroundColor', color: this.getAttribute('data-bg') });
                send({ action: 'changeTimeColor', color: this.getAttribute('data-font') });
            });
        });
        document.getElementById('send-video').addEventListener('click', function() {
            var url = document.getElementById('video-url').value.trim();
            if (url && /\.m3u8(\?.*)?$|\.m3(\?.*)?$/i.test(url)) {
                send({ action: 'playVideo', url: url });
            } else { alert('请输入有效的 .m3u8 或 .m3 视频地址'); }
        });
        document.getElementById('show-player').addEventListener('click', function() {
            send({ action: 'showPlayer' });
        });
        document.getElementById('send-webpage').addEventListener('click', function() {
            var url = document.getElementById('video-url').value.trim();
            if (url) { send({ action: 'pushWebpage', url: url }); }
            else { alert('请输入有效的网页地址'); }
        });
        document.getElementById('show-webpage').addEventListener('click', function() {
            var url = document.getElementById('video-url').value.trim();
            if (url) { send({ action: 'showWebpage', url: url }); }
            else { alert('请输入有效的网页地址'); }
        });
    </script>
</body>
</html>
