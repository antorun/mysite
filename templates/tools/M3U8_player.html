<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>她的盛焰 - 在线播放</title>
    <!-- 多CDN源加载hls.js -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script>
        // 如果第一个CDN加载失败，尝试其他CDN
        if (typeof Hls === 'undefined') {
            document.write('<script src="https://unpkg.com/hls.js@latest"><\/script>');
        }
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .container {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            margin: 30px 0;
        }
        
        h1 {
            font-size: 2.8rem;
            margin-bottom: 10px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }
        
        .subtitle {
            font-size: 1.2rem;
            opacity: 0.85;
            max-width: 600px;
            margin: 0 auto;
        }
        
        .player-container {
            background: rgba(0, 0, 0, 0.5);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            margin-bottom: 30px;
        }
        
        #video-player {
            width: 100%;
            aspect-ratio: 16/9;
            display: block;
            background: #000;
        }
        
        .controls {
            padding: 20px;
        }
        
        .episode-selector {
            margin: 20px 0;
            background: rgba(0, 0, 0, 0.2);
            padding: 15px;
            border-radius: 8px;
        }
        
        .episode-selector label {
            display: block;
            margin-bottom: 12px;
            font-size: 1rem;
        }
        
        .episode-list {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        .episode-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }
        
        .episode-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }
        
        .episode-btn.active {
            background: #e50914;
            border-color: #e50914;
            box-shadow: 0 2px 8px rgba(229, 9, 20, 0.3);
        }
        
        footer {
            text-align: center;
            margin-top: 40px;
            padding: 20px 0;
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.9rem;
        }
        
        @media (max-width: 600px) {
            h1 {
                font-size: 2rem;
            }
            
            .subtitle {
                font-size: 1rem;
            }
            
            .episode-btn {
                padding: 8px 15px;
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>她的盛焰</h1>
            <p class="subtitle">在线播放 - 支持多集切换</p>
        </header>
        
        <div class="player-container">
            <video id="video-player" controls></video>
        </div>
        
        <div class="controls">
            <div class="episode-selector">
                <label>选择集数</label>
                <div class="episode-list" id="episode-list">
                    <!-- 集数按钮将通过JS动态生成 -->
                </div>
            </div>
        </div>
        
    </div>
    
    <footer>
        <p>HLS流媒体播放器</p>
    </footer>

    <script>
        // 等待HLS.js加载完成
        function waitForHls(callback) {
            if (typeof Hls !== 'undefined') {
                callback();
            } else {
                setTimeout(() => waitForHls(callback), 100);
            }
        }

        // 视频数据
        const episodes = [
            { id: 1, title: '第27集', url: 'https://ukzy.ukubf3.com/20260328/dUsTvXib/2000kb/hls/index.m3u8' },
            { id: 2, title: '第28集', url: 'https://ukzy.ukubf3.com/20260328/O3rlfRfN/2000kb/hls/index.m3u8' },
            { id: 3, title: '第29集', url: 'https://ukzy.ukubf3.com/20260328/CIv6csnu/2000kb/hls/index.m3u8' },
            { id: 4, title: '第30集', url: 'https://ukzy.ukubf3.com/20260328/FuppX109/2000kb/hls/index.m3u8' }
        ];

        // 获取DOM元素
        const videoPlayer = document.getElementById('video-player');
        const episodeList = document.getElementById('episode-list');
        
        let hls = null;
        let currentEpisode = 0;
        
        // 初始化集数列表
        function initEpisodeList() {
            episodes.forEach((episode, index) => {
                const btn = document.createElement('button');
                btn.className = 'episode-btn' + (index === 0 ? ' active' : '');
                btn.textContent = episode.title;
                btn.addEventListener('click', () => {
                    // 更新选中状态
                    document.querySelectorAll('.episode-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    // 播放视频
                    initPlayer(episode.url);
                    currentEpisode = index;
                });
                episodeList.appendChild(btn);
            });
        }
        
        // 初始化播放器
        function initPlayer(url) {
            console.log('Initializing player with URL:', url);
            
            // 清理现有实例
            if (hls) {
                hls.destroy();
                hls = null;
            }
            
            // 检查是否原生支持HLS (Safari)
            if (videoPlayer.canPlayType('application/vnd.apple.mpegurl')) {
                console.log('Using native HLS support');
                videoPlayer.src = url;
                videoPlayer.play().catch(e => console.error('Play error:', e));
                return;
            }
            
            // 检查HLS.js是否可用
            if (typeof Hls === 'undefined') {
                console.error('HLS.js is not loaded');
                alert('视频播放器加载失败，请刷新页面重试');
                return;
            }
            
            // 使用hls.js提供跨浏览器支持
            if (Hls.isSupported()) {
                console.log('Using HLS.js');
                hls = new Hls({
                    debug: true,
                    enableWorker: true,
                    lowLatencyMode: true,
                    backBufferLength: 90,
                    maxBufferLength: 30,
                    maxMaxBufferLength: 600
                });
                
                hls.loadSource(url);
                hls.attachMedia(videoPlayer);
                
                // 设置监听器
                hls.on(Hls.Events.MANIFEST_PARSED, function(event, data) {
                    console.log('Manifest parsed, quality levels:', data.levels.length);
                    videoPlayer.play().catch(e => console.error('Play error:', e));
                });
                
                hls.on(Hls.Events.ERROR, function(event, data) {
                    console.error('HLS error:', data);
                    
                    if (data.fatal) {
                        switch(data.type) {
                            case Hls.ErrorTypes.NETWORK_ERROR:
                                console.log('Network error, trying to recover...');
                                hls.startLoad();
                                break;
                            case Hls.ErrorTypes.MEDIA_ERROR:
                                console.log('Media error, trying to recover...');
                                hls.recoverMediaError();
                                break;
                            default:
                                console.log('Fatal error, destroying player');
                                hls.destroy();
                                break;
                        }
                    }
                });
            } else {
                console.error('HLS is not supported in this browser');
                alert('您的浏览器不支持HLS播放');
            }
        }
        
        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', function() {
            waitForHls(() => {
                console.log('HLS.js loaded, initializing...');
                initEpisodeList();
                // 默认加载第一集
                initPlayer(episodes[0].url);
            });
        });
    </script>
</body>
</html>
